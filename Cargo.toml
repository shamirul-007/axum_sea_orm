[package]
name = "axum_sea_orm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

sea-orm = { version = "0.12", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros"
] }

sea-orm-migration = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }

regex = "1.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
