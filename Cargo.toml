[package]
name = "axum_sea_orm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

sea-orm = { version = "0.12", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros"
] }

sea-orm-migration = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }

regex = "1.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.5", features = ["trace"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4"] }
chrono = "0.4.44"
jsonwebtoken = "9"                       # JWT encode/decode (HS256)
argon2       = "0.5"                      # password hashing (salted)
sha2         = "0.10"                     # deterministic hash for refresh tokens
rand         = "0.8"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
